<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - APE Petit-Cœur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{cyber:{bg:'#0B0F19',card:'#151C2C',border:'#232D42',pink:'#FF2A6D',cyan:'#05D9E8'}}}}}</script>
    <style>body{background:#0B0F19}.glass{background:rgba(21,28,44,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08)}.input{background:rgba(11,15,25,.6);border:1px solid rgba(255,255,255,.1);color:#fff}</style>
</head>
<body class="font-sans text-slate-200 min-h-screen flex flex-col">
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full opacity-0 transition-all px-4 py-2 rounded-xl glass text-xs font-bold text-cyber-cyan border border-cyber-cyan/30">Action réussie</div>
    
    <div id="login" class="fixed inset-0 z-50 bg-[#0B0F19] flex items-center justify-center p-4">
        <div class="max-w-xs w-full glass p-6 rounded-2xl text-center space-y-4">
            <h1 class="text-xl font-black text-white">ADMIN</h1>
            <form onsubmit="doLogin(event)" class="space-y-3">
                <input type="password" id="pass" placeholder="Code" required class="w-full p-2.5 input rounded-xl text-center text-xs font-bold">
                <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-cyber-pink to-cyber-cyan text-slate-900 font-bold rounded-xl text-xs">CONNEXION</button>
            </form>
        </div>
    </div>

    <div id="dash" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-60 bg-cyber-card/90 border-r border-cyber-border p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-3">
                <div class="font-bold text-white text-sm pb-2 border-b border-cyber-border"><i class="fas fa-cube text-cyber-cyan mr-1"></i> APE Admin</div>
                <nav class="space-y-1 text-xs font-bold">
                    <button onclick="tab('gen')" class="w-full text-left p-2 rounded-lg hover:bg-white/5 text-slate-300"><i class="fas fa-sliders text-cyber-cyan w-4"></i> Accueil</button>
                    <button onclick="tab('about')" class="w-full text-left p-2 rounded-lg hover:bg-white/5 text-slate-300"><i class="fas fa-users text-emerald-400 w-4"></i> Qui sommes-nous</button>
                    <button onclick="tab('posters')" class="w-full text-left p-2 rounded-lg hover:bg-white/5 text-slate-300"><i class="fas fa-bullhorn text-cyber-pink w-4"></i> Affiche & Boutons</button>
                    <button onclick="tab('events')" class="w-full text-left p-2 rounded-lg hover:bg-white/5 text-slate-300"><i class="fas fa-calendar text-amber-400 w-4"></i> Événements</button>
                    <button onclick="tab('gallery')" class="w-full text-left p-2 rounded-lg hover:bg-white/5 text-slate-300"><i class="fas fa-images text-purple-400 w-4"></i> Galerie</button>
                    <button onclick="tab('partners')" class="w-full text-left p-2 rounded-lg hover:bg-white/5 text-slate-300"><i class="fas fa-handshake text-teal-400 w-4"></i> Partenaires</button>
                    <button onclick="tab('contact')" class="w-full text-left p-2 rounded-lg hover:bg-white/5 text-slate-300"><i class="fas fa-envelope text-sky-400 w-4"></i> Contact</button>
                </nav>
            </div>
            <div class="pt-3 border-t border-cyber-border space-y-1 text-xs">
                <a href="index.html" target="_blank" class="block p-2 glass rounded-lg text-center font-bold text-slate-300">Voir le site</a>
                <button onclick="sessionStorage.clear();location.reload()" class="w-full p-2 text-cyber-pink font-bold text-left">Déconnexion</button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-6 space-y-4 overflow-y-auto text-xs">
            <div id="t-gen" class="sec hidden glass p-5 rounded-2xl space-y-3">
                <h3 class="font-bold text-white border-b border-cyber-border pb-2">ACCUEIL</h3>
                <div class="grid grid-cols-2 gap-2"><input id="f-name" placeholder="Nom" class="p-2 input rounded-lg"><input id="f-sub" placeholder="Sous-titre" class="p-2 input rounded-lg"></div>
                <input id="f-tag" placeholder="Badge" class="w-full p-2 input rounded-lg">
                <input id="f-title" placeholder="Grand Titre" class="w-full p-2 input rounded-lg text-cyber-cyan font-bold">
                <textarea id="f-desc" rows="2" placeholder="Description" class="w-full p-2 input rounded-lg"></textarea>
            </div>

            <div id="t-about" class="sec hidden glass p-5 rounded-2xl space-y-3">
                <h3 class="font-bold text-white border-b border-cyber-border pb-2">PRÉSENTATION</h3>
                <div class="grid grid-cols-2 gap-2"><input id="f-atag" placeholder="Badge" class="p-2 input rounded-lg"><input id="f-atitle" placeholder="Titre" class="p-2 input rounded-lg"></div>
                <textarea id="f-adesc" rows="2" placeholder="Intro" class="w-full p-2 input rounded-lg"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <div class="p-3 bg-cyber-bg rounded-xl space-y-2"><input id="f-b1t" placeholder="Titre Bloc 1" class="w-full p-1.5 input rounded font-bold"><textarea id="f-b1d" rows="2" placeholder="Texte" class="w-full p-1.5 input rounded"></textarea><input id="f-b1i" placeholder="Image URL" class="w-full p-1.5 input rounded"></div>
                    <div class="p-3 bg-cyber-bg rounded-xl space-y-2"><input id="f-b2t" placeholder="Titre Bloc 2" class="w-full p-1.5 input rounded font-bold"><textarea id="f-b2d" rows="2" placeholder="Citation" class="w-full p-1.5 input rounded"></textarea><input id="f-fbtn" placeholder="Texte Bouton PDF" class="w-full p-1.5 input rounded"><input id="f-furl" placeholder="URL PDF/Statuts" class="w-full p-1.5 input rounded"></div>
                </div>
            </div>

            <div id="t-posters" class="sec hidden glass p-5 rounded-2xl space-y-3">
                <h3 class="font-bold text-white border-b border-cyber-border pb-2">AFFICHE & BOUTONS</h3>
                <div class="grid grid-cols-2 gap-2"><input id="f-phead" placeholder="Titre haut" class="p-2 input rounded-lg"><input id="f-pcap" placeholder="Légende" class="p-2 input rounded-lg"></div>
                <div class="flex gap-2"><input id="f-pimg" placeholder="Image Affiche URL" class="w-full p-2 input rounded-lg"><input type="file" accept="image/*" class="hidden" id="fi-p" onchange="file64(event,'f-pimg')"><label for="fi-p" class="px-3 py-2 bg-cyber-cyan text-slate-900 font-bold rounded-lg cursor-pointer">Image</label></div>
                <div class="pt-2 border-t border-cyber-border space-y-2">
                    <div class="flex justify-between font-bold text-amber-400"><span>Boutons sous l'affiche</span><button onclick="addBtn()" class="px-2 py-1 bg-amber-400 text-slate-900 rounded">+ Bouton</button></div>
                    <div id="c-btns" class="space-y-2"></div>
                </div>
            </div>

            <div id="t-events" class="sec hidden glass p-5 rounded-2xl space-y-3">
                <div class="flex justify-between font-bold text-amber-400 border-b border-cyber-border pb-2"><span>ÉVÉNEMENTS</span><button onclick="addEv()" class="px-2 py-1 bg-amber-400 text-slate-900 rounded">+ Ajouter</button></div>
                <div id="c-events" class="space-y-2"></div>
            </div>

            <div id="t-gallery" class="sec hidden glass p-5 rounded-2xl space-y-3">
                <div class="flex justify-between font-bold text-purple-400 border-b border-cyber-border pb-2"><span>GALERIE</span><button onclick="addGal()" class="px-2 py-1 bg-purple-500 text-white rounded">+ Album</button></div>
                <div id="c-gallery" class="space-y-3"></div>
            </div>

            <div id="t-partners" class="sec hidden glass p-5 rounded-2xl space-y-3">
                <div class="flex justify-between font-bold text-teal-400 border-b border-cyber-border pb-2"><span>PARTENAIRES</span><button onclick="addPart()" class="px-2 py-1 bg-teal-400 text-slate-900 rounded">+ Partenaire</button></div>
                <div class="grid grid-cols-2 gap-2"><input id="f-ptag" placeholder="Badge" class="p-2 input rounded-lg"><input id="f-ptitle" placeholder="Titre" class="p-2 input rounded-lg font-bold text-teal-400"></div>
                <textarea id="f-pdesc" rows="2" placeholder="Description générale" class="w-full p-2 input rounded-lg"></textarea>
                <div id="c-partners" class="space-y-2"></div>
            </div>

            <div id="t-contact" class="sec hidden glass p-5 rounded-2xl space-y-3">
                <h3 class="font-bold text-white border-b border-cyber-border pb-2">CONTACT</h3>
                <div class="grid grid-cols-2 gap-2"><input id="f-ctag" placeholder="Badge" class="p-2 input rounded-lg"><input id="f-ctitle" placeholder="Titre" class="p-2 input rounded-lg font-bold text-sky-400"></div>
                <textarea id="f-cdesc" rows="2" placeholder="Description" class="w-full p-2 input rounded-lg"></textarea>
                <div class="grid grid-cols-2 gap-2"><input id="f-cemail" placeholder="Email" class="p-2 input rounded-lg"><input id="f-cphone" placeholder="Téléphone" class="p-2 input rounded-lg"></div>
                <input id="f-caddr" placeholder="Adresse" class="w-full p-2 input rounded-lg">
            </div>

            <div class="pt-3 border-t border-cyber-border flex justify-end">
                <button onclick="save()" class="w-full sm:w-auto px-6 py-3 bg-gradient-to-r from-cyber-cyan to-cyber-pink text-slate-900 font-black rounded-xl shadow-lg"><i class="fas fa-save mr-1"></i> ENREGISTRER</button>
            </div>
        </main>
    </div>

    <script>
        const SB = supabase.createClient('https://gdbktvxramksondbobns.supabase.co', 'sb_publishable_6Q9vML3WwH7_8n5Ipvo-3g_DRZx_VPK');
        let D = {general:{assocName:"APE de Petit-Cœur",assocSub:"La Léchère",posterButtons:[]}, about:{}, partners:{list:[]}, contact:{}, upcomingEvents:[], pastEvents:[]};

        window.onload = () => {
            if(sessionStorage.getItem('auth')==='1') { document.getElementById('login').remove(); document.getElementById('dash').classList.remove('hidden'); tab('gen'); load(); }
        };
        function doLogin(e) {
            e.preventDefault();
            if(document.getElementById('pass').value === (D.general.adminPassword || 'admin123')) { sessionStorage.setItem('auth','1'); location.reload(); }
            else alert('Code incorrect');
        }
        function tab(id) {
            document.querySelectorAll('.sec').forEach(e=>e.classList.add('hidden'));
            document.getElementById('t-'+id).classList.remove('hidden');
        }
        function load() {
            let raw = localStorage.getItem('site_d');
            if(raw) try{D=JSON.parse(raw)}catch(e){}
            SB.from('site_content').select('content').eq('id',1).single().then(({data})=>{if(data?.content){D=data.content;fill()}});
            fill();
        }
        function fill() {
            let g=D.general||{}, a=D.about||{}, p=D.partners||{}, c=D.contact||{};
            set('f-name',g.assocName); set('f-sub',g.assocSub); set('f-tag',g.locationTag); set('f-title',g.heroTitle); set('f-desc',g.heroDesc);
            set('f-atag',a.tag); set('f-atitle',a.title); set('f-adesc',a.desc); set('f-b1t',a.block1Title); set('f-b1d',a.block1Text); set('f-b1i',a.block1Img); set('f-b2t',a.block2Title); set('f-b2d',a.block2Text); set('f-furl',a.fileUrl); set('f-fbtn',a.fileBtnText);
            set('f-phead',g.posterHeading); set('f-pcap',g.posterCaption); set('f-pimg',g.posterImg);
            set('f-ptag',p.tag); set('f-ptitle',p.title); set('f-pdesc',p.desc);
            set('f-ctag',c.tag); set('f-ctitle',c.title); set('f-cdesc',c.desc); set('f-cemail',c.email); set('f-cphone',c.phone); set('f-caddr',c.address);
            renderList();
        }
        function set(id,v){let e=document.getElementById(id);if(e)e.value=v||''}
        function renderList() {
            let bc = document.getElementById('c-btns'); bc.innerHTML='';
            (D.general.posterButtons||[]).forEach((b,i)=>{
                bc.innerHTML+=`<div class="flex gap-2"><input value="${b.label||''}" onchange="D.general.posterButtons[${i}].label=this.value" class="p-1 input rounded w-1/3 text-xs"><input value="${b.url||''}" onchange="D.general.posterButtons[${i}].url=this.value" class="p-1 input rounded w-full text-xs"><button onclick="D.general.posterButtons.splice(${i},1);renderList()" class="text-pink-500 font-bold px-2">✕</button></div>`;
            });
            let ec = document.getElementById('c-events'); ec.innerHTML='';
            (D.upcomingEvents||[]).forEach((ev,i)=>{
                ec.innerHTML+=`<div class="p-2 bg-cyber-bg rounded-lg space-y-1"><div class="flex gap-2"><input value="${ev.title||''}" onchange="D.upcomingEvents[${i}].title=this.value" class="p-1 input rounded w-2/3 text-xs font-bold"><input value="${ev.date||''}" onchange="D.upcomingEvents[${i}].date=this.value" class="p-1 input rounded w-1/3 text-xs"><button onclick="D.upcomingEvents.splice(${i},1);renderList()" class="text-pink-500 font-bold">✕</button></div><input value="${ev.desc||''}" onchange="D.upcomingEvents[${i}].desc=this.value" class="p-1 input rounded w-full text-xs"></div>`;
            });
            let gc = document.getElementById('c-gallery'); gc.innerHTML='';
            (D.pastEvents||[]).forEach((ev,i)=>{
                let imgs=(ev.photos||[]).map((ph,pi)=>`<span class="relative"><img src="${ph}" class="h-10 w-10 object-cover rounded"><button onclick="D.pastEvents[${i}].photos.splice(${pi},1);renderList()" class="absolute -top-1 -right-1 bg-pink-600 text-white rounded-full w-3 h-3 text-[8px]">✕</button></span>`).join('');
                gc.innerHTML+=`<div class="p-2 bg-cyber-bg rounded-lg space-y-2"><div class="flex gap-2"><input value="${ev.title||''}" onchange="D.pastEvents[${i}].title=this.value" class="p-1 input rounded w-2/3 text-xs font-bold"><input value="${ev.date||''}" onchange="D.pastEvents[${i}].date=this.value" class="p-1 input rounded w-1/3 text-xs"><button onclick="D.pastEvents.splice(${i},1);renderList()" class="text-pink-500 font-bold">✕</button></div><div class="flex items-center gap-1 overflow-x-auto">${imgs}<input type="file" accept="image/*" class="hidden" id="gf-${i}" onchange="addPh(event, ${i})"><label for="gf-${i}" class="px-2 py-1 bg-purple-500 text-white text-[10px] rounded cursor-pointer">+ Photo</label></div></div>`;
            });
            let pc = document.getElementById('c-partners'); pc.innerHTML='';
            (D.partners.list||[]).forEach((pt,i)=>{
                pc.innerHTML+=`<div class="p-2 bg-cyber-bg rounded-lg space-y-1"><div class="flex gap-2"><input value="${pt.name||''}" onchange="D.partners.list[${i}].name=this.value" class="p-1 input rounded w-1/2 text-xs font-bold"><input value="${pt.link||''}" onchange="D.partners.list[${i}].link=this.value" class="p-1 input rounded w-1/2 text-xs" placeholder="Lien web"><button onclick="D.partners.list.splice(${i},1);renderList()" class="text-pink-500 font-bold">✕</button></div><input value="${pt.logo||''}" onchange="D.partners.list[${i}].logo=this.value" class="p-1 input rounded w-full text-xs" placeholder="Logo URL"></div>`;
            });
        }
        function addBtn(){D.general.posterButtons.push({label:'Lien',url:''});renderList()}
        function addEv(){D.upcomingEvents.push({title:'Événement',date:'Bientôt'});renderList()}
        function addGal(){D.pastEvents.push({title:'Album',date:'2026',photos:[]});renderList()}
        function addPart(){D.partners.list.push({name:'Partenaire'});renderList()}
        function addPh(e,i){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{resize(ev.target.result,b=>{D.pastEvents[i].photos.push(b);renderList()})};r.readAsDataURL(f);}
        function file64(e,id){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{resize(ev.target.result,b=>{document.getElementById(id).value=b})};r.readAsDataURL(f);}
        function resize(data,cb){let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),MAX=500,w=img.width,h=img.height;if(w>MAX){h*=MAX/w;w=MAX};c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.5)};img.src=data;}
        async function save() {
            let g=D.general, a=D.about, p=D.partners, c=D.contact;
            g.assocName=gval('f-name'); g.assocSub=gval('f-sub'); g.locationTag=gval('f-tag'); g.heroTitle=gval('f-title'); g.heroDesc=gval('f-desc');
            a.tag=gval('f-atag'); a.title=gval('f-atitle'); a.desc=gval('f-adesc'); a.block1Title=gval('f-b1t'); a.block1Text=gval('f-b1d'); a.block1Img=gval('f-b1i'); a.block2Title=gval('f-b2t'); a.block2Text=gval('f-b2d'); a.fileUrl=gval('f-furl'); a.fileBtnText=gval('f-fbtn');
            g.posterHeading=gval('f-phead'); g.posterCaption=gval('f-pcap'); g.posterImg=gval('f-pimg');
            p.tag=gval('f-ptag'); p.title=gval('f-ptitle'); p.desc=gval('f-pdesc');
            c.tag=gval('f-ctag'); c.title=gval('f-ctitle'); c.desc=gval('f-cdesc'); c.email=gval('f-cemail'); c.phone=gval('f-cphone'); c.address=gval('f-caddr');

            let s=JSON.stringify(D);
            try{localStorage.setItem('site_d',s)}catch(e){}
            await SB.from('site_content').upsert({id:1,content:D});
            let t=document.getElementById('toast'); t.classList.remove('translate-x-full','opacity-0'); setTimeout(()=>t.classList.add('translate-x-full','opacity-0'),2000);
        }
        function gval(id){let e=document.getElementById(id);return e?e.value:''}
    </script>
</body>
</html>
