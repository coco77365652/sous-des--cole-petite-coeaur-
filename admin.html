<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Admin - APE Petit-Cœur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://gdbktvxramksondbobns.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6Q9vML3WwH7_8n5Ipvo-3g_DRZx_VPK';
        let _supabase = null;
        try { _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e){}
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { cyber: { bg: '#0B0F19', card: '#151C2C', border: '#232D42', pink: '#FF2A6D', cyan: '#05D9E8', purple: '#7B2CBF', green: '#00F5D4' } } } } }

    </style>
</head>
<body class="font-sans text-slate-200 min-h-screen flex flex-col">

    <!-- TOAST -->
    <div id="status-toast" class="fixed top-5 right-5 z-50 transform translate-x-full opacity-0 transition-all duration-300 px-5 py-3 rounded-xl glass-card flex items-center gap-3 border text-white text-sm font-bold">
        <i id="status-icon" class="fas fa-check text-cyber-cyan"></i>
        <span id="status-message">Action effectuée</span>
    </div>

    <!-- LOGIN -->
    <div id="login-view" class="fixed inset-0 z-50 bg-[#0B0F19]/95 flex items-center justify-center p-4">
        <div class="max-w-sm w-full glass-card rounded-2xl p-6 text-center space-y-4">
            <h1 class="text-2xl font-black text-white">STUDIO ADMIN</h1>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass-input" placeholder="Code d'accès" required class="w-full px-4 py-3 glass-input rounded-xl text-center text-sm font-bold">
                <p id="login-error" class="text-cyber-pink text-xs font-semibold hidden">Code incorrect.</p>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyber-pink to-cyber-purple text-white font-bold rounded-xl text-sm">SE CONNECTER</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="admin-dashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-cyber-card/90 border-r border-cyber-border p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-4">
                <div class="font-bold text-white text-lg pb-3 border-b border-cyber-border flex items-center gap-2">
                    <i class="fas fa-cube text-cyber-cyan"></i> APE Petit-Cœur
                </div>
                <nav class="space-y-1 text-xs font-bold">
                    <button onclick="switchTab('tab-general')" id="nav-tab-general" class="nav-btn w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-300 flex items-center gap-2"><i class="fas fa-sliders text-cyber-cyan w-4"></i> Textes Accueil</button>
                    <button onclick="switchTab('tab-about')" id="nav-tab-about" class="nav-btn w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-300 flex items-center gap-2"><i class="fas fa-users text-cyber-green w-4"></i> Qui sommes-nous ?</button>
                    <button onclick="switchTab('tab-images')" id="nav-tab-images" class="nav-btn w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-300 flex items-center gap-2"><i class="fas fa-bullhorn text-cyber-pink w-4"></i> Affiches & Docs</button>
                    <button onclick="switchTab('tab-events')" id="nav-tab-events" class="nav-btn w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-300 flex items-center gap-2"><i class="fas fa-calendar-star text-amber-400 w-4"></i> Événements</button>
                    <button onclick="switchTab('tab-gallery')" id="nav-tab-gallery" class="nav-btn w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-300 flex items-center gap-2"><i class="fas fa-photo-film text-cyber-purple w-4"></i> Galerie Photos</button>
                    <button onclick="switchTab('tab-partners')" id="nav-tab-partners" class="nav-btn w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-300 flex items-center gap-2"><i class="fas fa-handshake text-emerald-400 w-4"></i> Nos Partenaires</button>
                    <button onclick="switchTab('tab-contact')" id="nav-tab-contact" class="nav-btn w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-slate-300 flex items-center gap-2"><i class="fas fa-envelope text-sky-400 w-4"></i> Contact</button>
                </nav>
            </div>
            <div class="pt-4 border-t border-cyber-border space-y-2">
                <a href="index.html" target="_blank" class="block text-center py-2 glass-card rounded-xl text-xs font-bold text-slate-300 hover:text-cyber-cyan"><i class="fas fa-globe mr-1"></i> Voir le site</a>
                <button onclick="logoutAdmin()" class="w-full text-center py-2 text-xs font-bold text-cyber-pink"><i class="fas fa-power-off mr-1"></i> Déconnexion</button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="flex-1 p-6 space-y-6 overflow-y-auto">
            <!-- TAB 1: TEXTES ACCUEIL -->
            <div id="tab-general" class="tab-content hidden glass-card rounded-2xl p-6 space-y-4">
                <h3 class="font-bold text-white border-b border-cyber-border pb-2 text-sm uppercase">Accueil</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div><label class="block text-slate-400 mb-1 font-bold">Nom Association</label><input type="text" id="cfg-siteName" class="w-full p-2.5 glass-input rounded-xl"></div>
                    <div><label class="block text-slate-400 mb-1 font-bold">Sous-titre</label><input type="text" id="cfg-siteLocation" class="w-full p-2.5 glass-input rounded-xl"></div>
                </div>
                <div class="text-xs space-y-3">
                    <div><label class="block text-slate-400 mb-1 font-bold">Badge Supérieur</label><input type="text" id="cfg-locationTag" class="w-full p-2.5 glass-input rounded-xl"></div>
                    <div><label class="block text-slate-400 mb-1 font-bold">Grand Titre</label><input type="text" id="cfg-heroTitle" class="w-full p-2.5 glass-input rounded-xl text-cyber-cyan font-bold"></div>
                    <div><label class="block text-slate-400 mb-1 font-bold">Description</label><textarea id="cfg-heroDesc" rows="3" class="w-full p-2.5 glass-input rounded-xl"></textarea></div>
                </div>
            </div>

            <!-- TAB 2: QUI SOMMES-NOUS -->
            <div id="tab-about" class="tab-content hidden glass-card rounded-2xl p-6 space-y-4">
                <h3 class="font-bold text-white border-b border-cyber-border pb-2 text-sm uppercase">Qui sommes-nous ?</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div><label class="block text-slate-400 mb-1 font-bold">Badge</label><input type="text" id="cfg-aboutTag" class="w-full p-2.5 glass-input rounded-xl"></div>
                    <div><label class="block text-slate-400 mb-1 font-bold">Titre</label><input type="text" id="cfg-aboutTitle" class="w-full p-2.5 glass-input rounded-xl font-bold text-cyber-green"></div>
                </div>
                <div class="text-xs"><label class="block text-slate-400 mb-1 font-bold">Intro</label><textarea id="cfg-aboutDesc" rows="2" class="w-full p-2.5 glass-input rounded-xl"></textarea></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs pt-2">
                    <div class="p-3 bg-cyber-bg rounded-xl border border-cyber-border space-y-2">
                        <p class="font-bold text-cyber-cyan">Bloc 1 (Mission)</p>
                        <input type="text" id="cfg-aboutBlock1Title" placeholder="Titre Bloc 1" class="w-full p-2 glass-input rounded-lg font-bold">
                        <textarea id="cfg-aboutBlock1Text" rows="3" placeholder="Texte Bloc 1" class="w-full p-2 glass-input rounded-lg"></textarea>
                        <div class="flex gap-2"><input type="text" id="cfg-aboutBlock1Img" placeholder="URL Image..." class="w-full p-2 glass-input rounded-lg"><label class="p-2 bg-cyber-cyan text-slate-900 font-bold rounded-lg cursor-pointer shrink-0"><i class="fas fa-upload"></i><input type="file" accept="image/*" class="hidden" onchange="processImg(event, 'cfg-aboutBlock1Img')"></label></div>
                    </div>
                    <div class="p-3 bg-cyber-bg rounded-xl border border-cyber-border space-y-2">
                        <p class="font-bold text-cyber-pink">Bloc 2 (Mot du Bureau & Statuts)</p>
                        <input type="text" id="cfg-aboutBlock2Title" placeholder="Titre Bloc 2" class="w-full p-2 glass-input rounded-lg font-bold">
                        <textarea id="cfg-aboutBlock2Text" rows="3" placeholder="Texte Bloc 2" class="w-full p-2 glass-input rounded-lg italic"></textarea>
                        <input type="text" id="cfg-aboutFileBtnText" placeholder="Texte Bouton PDF..." class="w-full p-2 glass-input rounded-lg">
                        <div class="flex gap-2"><input type="text" id="cfg-aboutFileUrl" placeholder="URL ou PDF..." class="w-full p-2 glass-input rounded-lg"><label class="p-2 bg-cyber-pink text-white font-bold rounded-lg cursor-pointer shrink-0"><i class="fas fa-file-pdf"></i><input type="file" accept="application/pdf,image/*" class="hidden" onchange="processFile(event, 'cfg-aboutFileUrl')"></label></div>
                    </div>
                </div>
            </div>

            <!-- TAB 3: AFFICHE ET DOCS -->
            <div id="tab-images" class="tab-content hidden glass-card rounded-2xl p-6 space-y-4 text-xs">
                <h3 class="font-bold text-white border-b border-cyber-border pb-2 text-sm uppercase">Logo & Affiche</h3>
                <div class="p-3 bg-cyber-bg rounded-xl border border-cyber-border space-y-2">
                    <p class="font-bold text-cyber-pink">Logo APE</p>
                    <div class="flex gap-2"><input type="text" id="cfg-logoImg" class="w-full p-2 glass-input rounded-lg"><label class="p-2 bg-cyber-pink text-white font-bold rounded-lg cursor-pointer shrink-0"><i class="fas fa-upload"></i><input type="file" accept="image/*" class="hidden" onchange="processImg(event, 'cfg-logoImg')"></label></div>
                </div>
                <div class="p-3 bg-cyber-bg rounded-xl border border-cyber-border space-y-2">
                    <p class="font-bold text-cyber-cyan">Affiche Principale</p>
                    <div class="grid grid-cols-2 gap-2"><input type="text" id="cfg-posterHeading" placeholder="Titre..." class="p-2 glass-input rounded-lg"><input type="text" id="cfg-posterCaption" placeholder="Légende..." class="p-2 glass-input rounded-lg"></div>
                    <div class="flex gap-2"><input type="text" id="cfg-posterImg" class="w-full p-2 glass-input rounded-lg"><label class="p-2 bg-cyber-cyan text-slate-900 font-bold rounded-lg cursor-pointer shrink-0"><i class="fas fa-upload"></i><input type="file" accept="image/*" class="hidden" onchange="processImg(event, 'cfg-posterImg')"></label></div>
                </div>
                <div class="p-3 bg-cyber-bg rounded-xl border border-cyber-border space-y-3">
                    <div class="flex justify-between items-center"><p class="font-bold text-amber-400">Boutons sous l'affiche</p><button onclick="addPosterBtnItem()" class="px-3 py-1 bg-amber-400 text-slate-900 font-bold rounded-lg">+ Ajouter</button></div>
                    <div id="poster-buttons-admin-container" class="space-y-2"></div>
                </div>
            </div>

            <!-- TAB 4: ÉVÉNEMENTS -->
            <div id="tab-events" class="tab-content hidden glass-card rounded-2xl p-6 space-y-4 text-xs">
                <div class="flex justify-between items-center border-b border-cyber-border pb-2"><h3 class="font-bold text-white text-sm uppercase">Prochains Événements</h3><button onclick="addUpcomingEvent()" class="px-3 py-1 bg-amber-400 text-slate-900 font-bold rounded-lg">+ Ajouter</button></div>
                <div id="upcoming-events-container" class="space-y-3"></div>
            </div>

            <!-- TAB 5: GALERIE -->
            <div id="tab-gallery" class="tab-content hidden glass-card rounded-2xl p-6 space-y-4 text-xs">
                <div class="flex justify-between items-center border-b border-cyber-border pb-2"><h3 class="font-bold text-white text-sm uppercase">Galerie Photos</h3><button onclick="addPastEvent()" class="px-3 py-1 bg-cyber-purple text-white font-bold rounded-lg">+ Créer Album</button></div>
                <div id="past-events-container" class="space-y-4"></div>
            </div>

            <!-- TAB 6: PARTENAIRES -->
            <div id="tab-partners" class="tab-content hidden glass-card rounded-2xl p-6 space-y-4 text-xs">
                <div class="flex justify-between items-center border-b border-cyber-border pb-2"><h3 class="font-bold text-white text-sm uppercase">Nos Partenaires</h3><button onclick="addPartnerItem()" class="px-3 py-1 bg-emerald-400 text-slate-900 font-bold rounded-lg">+ Ajouter</button></div>
                <div class="grid grid-cols-2 gap-2"><input type="text" id="cfg-partnersTag" placeholder="Badge..." class="p-2 glass-input rounded-lg"><input type="text" id="cfg-partnersTitle" placeholder="Titre..." class="p-2 glass-input rounded-lg text-emerald-400 font-bold"></div>
                <textarea id="cfg-partnersDesc" rows="2" placeholder="Description générale..." class="w-full p-2 glass-input rounded-lg"></textarea>
                <div id="partners-admin-container" class="space-y-3 pt-2"></div>
            </div>

            <!-- TAB 7: CONTACT -->
            <div id="tab-contact" class="tab-content hidden glass-card rounded-2xl p-6 space-y-4 text-xs">
                <h3 class="font-bold text-white border-b border-cyber-border pb-2 text-sm uppercase">Contact</h3>
                <div class="grid grid-cols-2 gap-2"><input type="text" id="cfg-contactTag" class="p-2 glass-input rounded-lg"><input type="text" id="cfg-contactTitle" class="p-2 glass-input rounded-lg text-sky-400 font-bold"></div>
                <textarea id="cfg-contactDesc" rows="2" class="w-full p-2 glass-input rounded-lg"></textarea>
                <div class="grid grid-cols-2 gap-2"><input type="email" id="cfg-contactEmail" placeholder="Email" class="p-2 glass-input rounded-lg"><input type="text" id="cfg-contactPhone" placeholder="Téléphone" class="p-2 glass-input rounded-lg"></div>
                <input type="text" id="cfg-contactAddress" placeholder="Adresse" class="w-full p-2 glass-input rounded-lg">
            </div>

            <!-- SAVE BUTTON -->
            <div class="pt-4 border-t border-cyber-border flex justify-end">
                <button onclick="globalSaveData()" id="save-btn" class="w-full sm:w-auto px-8 py-3 bg-gradient-to-r from-cyber-cyan via-brand-blue to-cyber-pink text-slate-900 font-black text-xs uppercase tracking-wider rounded-xl shadow-lg transition-transform active:scale-95"><i class="fas fa-floppy-disk mr-2"></i> ENREGISTRER</button>
            </div>
        </main>
    </div>

    <script>
        const DEFAULT_DATA = {
            general: { assocName: "APE de Petit-Cœur", assocSub: "Petit-Cœur • La Léchère", locationTag: "Savoie - Commune de La Léchère", heroTitle: "Ensemble pour les enfants de Petit-Cœur !", heroDesc: "Association de parents d'élèves bénévoles.", logoImg: "image_251ba6.png", posterImg: "image_251ba6.png", posterHeading: "À l'Affiche !", posterCaption: "Le Bureau du Sou des Écoles", posterButtons: [{ label: "Télécharger l'affiche", url: "image_251ba6.png" }], adminPassword: "admin123" },
            about: { tag: "Présentation", title: "Qui sommes-nous ?", desc: "Une équipe dédiée aux enfants.", block1Title: "Notre Mission", block1Text: "Financer les projets pédagogiques.", block1Img: "", block2Title: "Le Mot du Bureau", block2Text: "« Merci à tous nos soutiens ! »", fileUrl: "image_251ba6.png", fileBtnText: "Consulter les Statuts" },
            partners: { tag: "Soutien", title: "Nos Partenaires", desc: "Merci à nos partenaires !", list: [{ name: "Mairie de La Léchère", desc: "Soutien institutionnel.", logo: "image_251ba6.png", link: "https://www.la-lechere.fr" }] },
            contact: { tag: "Coordonnées", title: "Nous Contacter", desc: "Contactez-nous directement.", email: "ape.petitcoeur@gmail.com", phone: "06 00 00 00 00", address: "École Primaire, 73260 La Léchère" },
            upcomingEvents: [], pastEvents: []
        };
        let appData = Object.assign({}, DEFAULT_DATA);

        document.addEventListener('DOMContentLoaded', () => { loadInitialData(); checkSession(); });

        function checkSession() {
            if (sessionStorage.getItem('sou_admin_logged') === 'true') {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                switchTab('tab-general'); renderUI();
            } else {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('admin-dashboard').classList.add('hidden');
            }
        }
        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-pass-input').value === (appData.general.adminPassword || "admin123")) {
                sessionStorage.setItem('sou_admin_logged', 'true'); checkSession(); showToast("Connexion réussie");
            } else { document.getElementById('login-error').classList.remove('hidden'); }
        }
        function logoutAdmin() { sessionStorage.removeItem('sou_admin_logged'); checkSession(); }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-white/10', 'text-white'));
            const t = document.getElementById(tabId); if (t) t.classList.remove('hidden');
            const b = document.getElementById('nav-' + tabId); if (b) b.classList.add('bg-white/10', 'text-white');
        }

        function renderUI() {
            const g = appData.general || {}, ab = appData.about || {}, pt = appData.partners || {}, ct = appData.contact || {};
            const setV = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ''; };
            setV('cfg-siteName', g.assocName); setV('cfg-siteLocation', g.assocSub); setV('cfg-locationTag', g.locationTag); setV('cfg-heroTitle', g.heroTitle); setV('cfg-heroDesc', g.heroDesc); setV('cfg-logoImg', g.logoImg); setV('cfg-posterImg', g.posterImg); setV('cfg-posterHeading', g.posterHeading); setV('cfg-posterCaption', g.posterCaption);
            setV('cfg-aboutTag', ab.tag); setV('cfg-aboutTitle', ab.title); setV('cfg-aboutDesc', ab.desc); setV('cfg-aboutBlock1Title', ab.block1Title); setV('cfg-aboutBlock1Text', ab.block1Text); setV('cfg-aboutBlock1Img', ab.block1Img); setV('cfg-aboutBlock2Title', ab.block2Title); setV('cfg-aboutBlock2Text', ab.block2Text); setV('cfg-aboutFileUrl', ab.fileUrl); setV('cfg-aboutFileBtnText', ab.fileBtnText);
            setV('cfg-partnersTag', pt.tag); setV('cfg-partnersTitle', pt.title); setV('cfg-partnersDesc', pt.desc);
            setV('cfg-contactTag', ct.tag); setV('cfg-contactTitle', ct.title); setV('cfg-contactDesc', ct.desc); setV('cfg-contactEmail', ct.email); setV('cfg-contactPhone', ct.phone); setV('cfg-contactAddress', ct.address);
            renderPosterButtons(); renderPartners(); renderEvents(); renderGallery();
        }

        function renderPosterButtons() {
            const c = document.getElementById('poster-buttons-admin-container'); if(!c) return; c.innerHTML = '';
            (appData.general.posterButtons || []).forEach((b, i) => {
                c.innerHTML += `<div class="p-2 bg-cyber-card rounded-lg flex items-center gap-2 border border-cyber-border">
                    <input type="text" value="${b.label||''}" onchange="appData.general.posterButtons[${i}].label=this.value" placeholder="Texte" class="w-1/3 p-1.5 glass-input rounded text-xs">
                    <input type="text" id="pbtn-url-${i}" value="${b.url||''}" onchange="appData.general.posterButtons[${i}].url=this.value" placeholder="Lien/PDF" class="w-full p-1.5 glass-input rounded text-xs">
                    <label class="px-2 py-1 bg-cyber-cyan text-slate-900 font-bold rounded cursor-pointer shrink-0"><i class="fas fa-file-upload"></i><input type="file" accept="application/pdf,image/*" class="hidden" onchange="processFile(event, 'pbtn-url-${i}', (v)=>appData.general.posterButtons[${i}].url=v)"></label>
                    <button onclick="appData.general.posterButtons.splice(${i},1);renderPosterButtons()" class="text-cyber-pink font-bold px-1"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        }
        function addPosterBtnItem() { (appData.general.posterButtons = appData.general.posterButtons||[]).push({label:"Nouveau bouton", url:""}); renderPosterButtons(); }

        function renderPartners() {
            const c = document.getElementById('partners-admin-container'); if(!c) return; c.innerHTML = '';
            (appData.partners.list || []).forEach((p, i) => {
                c.innerHTML += `<div class="p-3 bg-cyber-card rounded-xl border border-cyber-border space-y-2 relative">
                    <button onclick="appData.partners.list.splice(${i},1);renderPartners()" class="absolute top-2 right-2 text-cyber-pink font-bold"><i class="fas fa-trash"></i></button>
                    <div class="grid grid-cols-2 gap-2"><input type="text" value="${p.name||''}" onchange="appData.partners.list[${i}].name=this.value" placeholder="Nom" class="p-1.5 glass-input rounded text-xs font-bold"><input type="text" value="${p.link||''}" onchange="appData.partners.list[${i}].link=this.value" placeholder="Site web (https://...)" class="p-1.5 glass-input rounded text-xs"></div>
                    <input type="text" value="${p.desc||''}" onchange="appData.partners.list[${i}].desc=this.value" placeholder="Description" class="w-full p-1.5 glass-input rounded text-xs">
                    <div class="flex gap-2"><input type="text" id="plogo-${i}" value="${p.logo||''}" onchange="appData.partners.list[${i}].logo=this.value" placeholder="Logo..." class="w-full p-1.5 glass-input rounded text-xs"><label class="px-2 py-1 bg-emerald-400 text-slate-900 font-bold rounded cursor-pointer shrink-0"><i class="fas fa-image"></i><input type="file" accept="image/*" class="hidden" onchange="processImg(event, 'plogo-${i}', (v)=>appData.partners.list[${i}].logo=v)"></label></div>
                </div>`;
            });
        }
        function addPartnerItem() { (appData.partners.list = appData.partners.list||[]).push({name:"Partenaire", desc:"", logo:"", link:""}); renderPartners(); }

        function renderEvents() {
            const c = document.getElementById('upcoming-events-container'); if(!c) return; c.innerHTML = '';
            (appData.upcomingEvents || []).forEach((ev, i) => {
                c.innerHTML += `<div class="p-3 bg-cyber-card rounded-xl border border-cyber-border space-y-2 relative">
                    <button onclick="appData.upcomingEvents.splice(${i},1);renderEvents()" class="absolute top-2 right-2 text-cyber-pink font-bold"><i class="fas fa-trash"></i></button>
                    <div class="grid grid-cols-2 gap-2 pr-6"><input type="text" value="${ev.title||''}" onchange="appData.upcomingEvents[${i}].title=this.value" placeholder="Titre" class="p-1.5 glass-input rounded text-xs font-bold"><input type="text" value="${ev.date||''}" onchange="appData.upcomingEvents[${i}].date=this.value" placeholder="Date" class="p-1.5 glass-input rounded text-xs"></div>
                    <textarea onchange="appData.upcomingEvents[${i}].desc=this.value" placeholder="Description" rows="2" class="w-full p-1.5 glass-input rounded text-xs">${ev.desc||ev.description||''}</textarea>
                </div>`;
            });
        }
        function addUpcomingEvent() { (appData.upcomingEvents = appData.upcomingEvents||[]).push({title:"Nouvel Événement", date:"Prochainement", desc:""}); renderEvents(); }

        function renderGallery() {
            const c = document.getElementById('past-events-container'); if(!c) return; c.innerHTML = '';
            (appData.pastEvents || []).forEach((pev, i) => {
                let imgs = (pev.photos||[]).map((p, pi) => `<div class="relative shrink-0"><img src="${p}" class="h-16 w-16 object-cover rounded-lg"><button onclick="appData.pastEvents[${i}].photos.splice(${pi},1);renderGallery()" class="absolute -top-1 -right-1 bg-cyber-pink text-white w-4 h-4 rounded-full text-[9px]">✕</button></div>`).join('');
                c.innerHTML += `<div class="p-3 bg-cyber-card rounded-xl border border-cyber-border space-y-2 relative">
                    <button onclick="appData.pastEvents.splice(${i},1);renderGallery()" class="absolute top-2 right-2 text-cyber-pink font-bold"><i class="fas fa-trash"></i></button>
                    <div class="grid grid-cols-2 gap-2 pr-6"><input type="text" value="${pev.title||''}" onchange="appData.pastEvents[${i}].title=this.value" placeholder="Titre Album" class="p-1.5 glass-input rounded text-xs font-bold"><input type="text" value="${pev.date||''}" onchange="appData.pastEvents[${i}].date=this.value" placeholder="Date" class="p-1.5 glass-input rounded text-xs"></div>
                    <div class="flex items-center gap-2 overflow-x-auto py-1">${imgs}<label class="h-16 w-16 border border-dashed border-cyber-purple flex items-center justify-center rounded-lg cursor-pointer shrink-0 text-cyber-purple font-bold"><i class="fas fa-plus"></i><input type="file" accept="image/*" class="hidden" onchange="addPhotoToAlbum(event, ${i})"></label></div>
                </div>`;
            });
        }
        function addPastEvent() { (appData.pastEvents = appData.pastEvents||[]).push({title:"Nouvel Album", date:"2026", photos:[]}); renderGallery(); }
        function addPhotoToAlbum(e, idx) {
            processImg(e, null, (base64) => { (appData.pastEvents[idx].photos = appData.pastEvents[idx].photos||[]).push(base64); renderGallery(); });
        }

        async function globalSaveData() {
            const btn = document.getElementById('save-btn'); btn.disabled = true; btn.innerText = "ENREGISTREMENT...";
            try {
                const getV = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
                appData.general.assocName = getV('cfg-siteName'); appData.general.assocSub = getV('cfg-siteLocation'); appData.general.locationTag = getV('cfg-locationTag'); appData.general.heroTitle = getV('cfg-heroTitle'); appData.general.heroDesc = getV('cfg-heroDesc'); appData.general.logoImg = getV('cfg-logoImg'); appData.general.posterImg = getV('cfg-posterImg'); appData.general.posterHeading = getV('cfg-posterHeading'); appData.general.posterCaption = getV('cfg-posterCaption');
                appData.about.tag = getV('cfg-aboutTag'); appData.about.title = getV('cfg-aboutTitle'); appData.about.desc = getV('cfg-aboutDesc'); appData.about.block1Title = getV('cfg-aboutBlock1Title'); appData.about.block1Text = getV('cfg-aboutBlock1Text'); appData.about.block1Img = getV('cfg-aboutBlock1Img'); appData.about.block2Title = getV('cfg-aboutBlock2Title'); appData.about.block2Text = getV('cfg-aboutBlock2Text'); appData.about.fileUrl = getV('cfg-aboutFileUrl'); appData.about.fileBtnText = getV('cfg-aboutFileBtnText');
                appData.partners.tag = getV('cfg-partnersTag'); appData.partners.title = getV('cfg-partnersTitle'); appData.partners.desc = getV('cfg-partnersDesc');
                appData.contact.tag = getV('cfg-contactTag'); appData.contact.title = getV('cfg-contactTitle'); appData.contact.desc = getV('cfg-contactDesc'); appData.contact.email = getV('cfg-contactEmail'); appData.contact.phone = getV('cfg-contactPhone'); appData.contact.address = getV('cfg-contactAddress');

                const serialized = JSON.stringify(appData);
                try { localStorage.setItem('sou_petit_coeur_data', serialized); localStorage.setItem('sou_app_data', serialized); } catch(e) { localStorage.clear(); localStorage.setItem('sou_petit_coeur_data', serialized); }
                if (_supabase) await _supabase.from('site_content').upsert({ id: 1, content: appData });
                showToast("Modifications enregistrées !");
            } catch (err) { showToast("Erreur de sauvegarde", true); }
            finally { btn.disabled = false; btn.innerText = "ENREGISTRER"; }
        }

        function loadInitialData() {
            const raw = localStorage.getItem('sou_petit_coeur_data') || localStorage.getItem('sou_app_data');
            if (raw) try { appData = Object.assign({}, DEFAULT_DATA, JSON.parse(raw)); } catch(e){}
        }

        function processFile(e, targetId, cb) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader(); r.onload = (evt) => {
                if(targetId) document.getElementById(targetId).value = evt.target.result;
                if(cb) cb(evt.target.result); showToast("Fichier chargé !");
            }; r.readAsDataURL(f);
        }

        function processImg(e, targetId, cb) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader(); r.onload = (evt) => {
                const img = new Image(); img.onload = () => {
                    const canvas = document.createElement('canvas'); const MAX = 500;
                    let w = img.width, h = img.height;
                    if (w > MAX) { h *= MAX / w; w = MAX; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const base64 = canvas.toDataURL('image/jpeg', 0.5);
                    if(targetId) document.getElementById(targetId).value = base64;
                    if(cb) cb(base64); showToast("Image optimisée !");
                }; img.src = evt.target.result;
            }; r.readAsDataURL(f);
        }

        function showToast(msg, err=false) {
            const t = document.getElementById('status-toast');
            document.getElementById('status-message').innerText = msg;
            t.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => t.classList.add('translate-x-full', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
