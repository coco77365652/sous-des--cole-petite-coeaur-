<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - APE de Petit-Cœur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://gdbktvxramksondbobns.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6Q9vML3WwH7_8n5Ipvo-3g_DRZx_VPK';
        let _supabase = null;
        try {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {}
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div id="status-box" class="fixed top-5 right-5 z-50 hidden px-6 py-4 rounded-2xl shadow-2xl font-bold text-white transition-all"></div>

    <div class="max-w-4xl mx-auto bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-2xl">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
            <h1 class="text-2xl font-bold text-rose-500"><i class="fas fa-cog mr-2"></i> Administration APE Petit-Cœur</h1>
            <a href="index.html" target="_blank" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-xl text-slate-200 transition">
                <i class="fas fa-external-link-alt mr-1"></i> Voir le site
            </a>
        </div>

        <form onsubmit="forceSave(event)" class="space-y-6">
            <div class="space-y-4 bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider">1. Textes d'Accueil</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nom de l'Association</label>
                    <input type="text" id="cfg-siteName" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-sm focus:border-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Titre Principal</label>
                    <input type="text" id="cfg-heroTitle" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-sm focus:border-rose-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Description</label>
                    <textarea id="cfg-heroDesc" rows="2" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-sm focus:border-rose-500 outline-none"></textarea>
                </div>
            </div>

            <div class="space-y-4 bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider">2. Images (Logo et Affiche)</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">URL / Base64 du Logo</label>
                    <div class="flex gap-2">
                        <input type="text" id="cfg-logoImg" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-sm focus:border-rose-500 outline-none">
                        <label class="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs px-4 py-2 rounded-xl cursor-pointer flex items-center shrink-0">
                            Choisir
                            <input type="file" accept="image/*" class="hidden" onchange="processImage(event, 'cfg-logoImg')">
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">URL / Base64 de l'Affiche</label>
                    <div class="flex gap-2">
                        <input type="text" id="cfg-posterImg" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-sm focus:border-rose-500 outline-none">
                        <label class="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs px-4 py-2 rounded-xl cursor-pointer flex items-center shrink-0">
                            Choisir
                            <input type="file" accept="image/*" class="hidden" onchange="processImage(event, 'cfg-posterImg')">
                        </label>
                    </div>
                </div>
            </div>

            <div class="space-y-4 bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider">3. Budget</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Récolté (€)</label>
                        <input type="number" id="proj-current" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-sm focus:border-rose-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Objectif (€)</label>
                        <input type="number" id="proj-target" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-sm focus:border-rose-500 outline-none">
                    </div>
                </div>
            </div>

            <button type="submit" id="save-btn" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg rounded-2xl shadow-xl transition active:scale-98 flex items-center justify-center gap-2 cursor-pointer">
                <i class="fas fa-save"></i>
                <span>ENREGISTRER LES MODIFICATIONS</span>
            </button>
        </form>
    </div>

    <script>
        const DEFAULT_DATA = {
            general: {
                assocName: "APE de Petit-Cœur",
                assocSub: "Petit-Cœur • La Léchère",
                locationTag: "Savoie - Commune de La Léchère",
                heroTitle: "Ensemble pour les enfants de Petit-Cœur !",
                heroDesc: "Association de parents d'élèves (APE) bénévoles dédiée au financement des sorties scolaires.",
                logoImg: "image_736dff.jpg",
                posterImg: "image_736dff.jpg",
                posterHeading: "À l'Affiche !",
                posterCaption: "Prochain événement du Sou des Écoles"
            },
            budget: { current: 3800, target: 5000 },
            pastEvents: []
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadForm();
        });

        function loadForm() {
            const raw = localStorage.getItem('sou_petit_coeur_data');
            let data = DEFAULT_DATA;
            if (raw) {
                try { data = JSON.parse(raw); } catch(e){}
            }
            const g = data.general || DEFAULT_DATA.general;
            const b = data.budget || DEFAULT_DATA.budget;

            document.getElementById('cfg-siteName').value = g.assocName || '';
            document.getElementById('cfg-heroTitle').value = g.heroTitle || '';
            document.getElementById('cfg-heroDesc').value = g.heroDesc || '';
            document.getElementById('cfg-logoImg').value = g.logoImg || '';
            document.getElementById('cfg-posterImg').value = g.posterImg || '';
            document.getElementById('proj-current').value = b.current || 3800;
            document.getElementById('proj-target').value = b.target || 5000;
        }

        async function forceSave(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement en cours...';

            const payload = {
                general: {
                    assocName: document.getElementById('cfg-siteName').value,
                    assocSub: "Petit-Cœur • La Léchère",
                    locationTag: "Savoie - Commune de La Léchère",
                    heroTitle: document.getElementById('cfg-heroTitle').value,
                    heroDesc: document.getElementById('cfg-heroDesc').value,
                    logoImg: document.getElementById('cfg-logoImg').value,
                    posterImg: document.getElementById('cfg-posterImg').value,
                    posterHeading: "À l'Affiche !",
                    posterCaption: "Prochain événement"
                },
                budget: {
                    current: parseFloat(document.getElementById('proj-current').value) || 0,
                    target: parseFloat(document.getElementById('proj-target').value) || 5000
                },
                pastEvents: []
            };

            let saveSuccess = false;
            let errorMsg = "";

            try {
                localStorage.setItem('sou_petit_coeur_data', JSON.stringify(payload));
                saveSuccess = true;
            } catch (err) {
                saveSuccess = false;
                errorMsg = "L'image est trop lourde pour le stockage local.";
            }

            if (_supabase) {
                try {
                    await _supabase.from('site_content').upsert({ id: 1, content: payload });
                } catch(err) {}
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> <span>ENREGISTRER LES MODIFICATIONS</span>';

            const statusBox = document.getElementById('status-box');
            statusBox.classList.remove('hidden', 'bg-emerald-600', 'bg-rose-600');

            if (saveSuccess) {
                statusBox.classList.add('bg-emerald-600');
                statusBox.innerHTML = '<i class="fas fa-check-circle mr-2"></i> OUI ! Les modifications sont enregistrées !';
            } else {
                statusBox.classList.add('bg-rose-600');
                statusBox.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i> NON ! ${errorMsg}`;
            }

            setTimeout(() => { statusBox.classList.add('hidden'); }, 4000);
        }

        function processImage(e, targetId) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const resizedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById(targetId).value = resizedBase64;
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
